name: Dependency Drift Guard

on:
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  outdated-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: "stable"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Check dependency drift
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT=$(flutter pub outdated)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -qiE "No dependencies are outdated|No outdated packages"; then
            echo "No dependency drift detected."
            exit 0
          fi
          echo "::error::Dependency drift detected. Review and update dependencies."
          exit 1
