name: Production Readiness Score

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Install dependencies
        run: dart pub get
      - name: Run tests
        run: dart test
      - name: Run analyzer
        run: dart analyze

