name: zorvyn_finance
description: "Zorvyn Finance, a personal finance companion built with Flutter and Riverpod."
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  freezed_annotation: ^3.1.0
  equatable: ^2.0.5
  flutter_dotenv: ^6.0.1
  supabase_flutter: ^2.9.1
  dio: ^5.5.0
  connectivity_plus: ^6.0.5
  pretty_dio_logger: ^1.4.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  ferry: ^0.16.1+2
  ferry_flutter: ^0.9.1+1
  gql_http_link: ^1.2.0
  built_value: ^8.9.2
  built_collection: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  freezed: ^3.2.2
  build_runner: ^2.4.8
  mocktail: ^1.0.3
  ferry_generator: 0.12.0+3
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - .env.example
    - assets/logo/
